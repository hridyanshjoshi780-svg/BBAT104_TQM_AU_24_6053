  <text x="280" y="235" text-anchor="middle" fill="#a7f3d0" font-size="12">Interactive Desktop Client Session</text>
  
  <!-- Arrow User to Auth -->
  <line x1="490" y1="219" x2="570" y2="219" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  
