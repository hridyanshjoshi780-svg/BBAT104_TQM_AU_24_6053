  <text x="172" y="1255" text-anchor="middle" fill="#f5d0fe" font-size="11">Data Grid Refreshed (&lt;50ms)</text>

  <rect x="310" y="1208" width="225" height="72" rx="8" fill="url(#respGrad)" stroke="#e879f9" stroke-width="1"/>
