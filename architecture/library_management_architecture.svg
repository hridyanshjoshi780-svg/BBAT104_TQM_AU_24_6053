<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1350" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
