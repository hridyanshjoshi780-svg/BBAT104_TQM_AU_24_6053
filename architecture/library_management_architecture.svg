  <text x="805" y="215" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Authentication &amp; Access Entry Point</text>
  <text x="805" y="235" text-anchor="middle" fill="#a7f3d0" font-size="12">Role Verification &amp; Session Management</text>

  <!-- Connect L1 to L2 -->
  <line x1="805" y1="248" x2="805" y2="295" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

