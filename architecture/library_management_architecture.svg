  <text x="745" y="555" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">CSV Import Manager</text>
  <text x="745" y="575" text-anchor="middle" fill="#c7d2fe" font-size="11">Header Verification</text>
  <text x="745" y="593" text-anchor="middle" fill="#93c5fd" font-size="10">&amp; Batch Validation</text>

  <rect x="850" y="525" width="190" height="85" rx="8" fill="url(#appGrad)" stroke="#818cf8" stroke-width="1"/>
  <text x="945" y="555" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Reporting Controller</text>
  <text x="945" y="575" text-anchor="middle" fill="#c7d2fe" font-size="11">Summary Generator</text>
  <text x="945" y="593" text-anchor="middle" fill="#93c5fd" font-size="10">&amp; Export Pipeline</text>

