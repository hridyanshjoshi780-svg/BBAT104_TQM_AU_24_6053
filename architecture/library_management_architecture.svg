  <text x="150" y="415" text-anchor="middle" fill="#38bdf8" font-size="10">Sub-string / Prefix</text>

  <rect x="255" y="340" width="180" height="90" rx="8" fill="url(#uiGrad)" stroke="#64748b" stroke-width="1"/>
  <text x="345" y="375" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Issue &amp; Return View</text>
  <text x="345" y="398" text-anchor="middle" fill="#cbd5e1" font-size="11">Circulation Ops</text>
  <text x="345" y="415" text-anchor="middle" fill="#38bdf8" font-size="10">Real-time Validation</text>

  <rect x="450" y="340" width="190" height="90" rx="8" fill="url(#perfGrad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="545" y="375" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">[Q02] Performance</text>
  <text x="545" y="395" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Dashboard View</text>
  <text x="545" y="415" text-anchor="middle" fill="#bfdbfe" font-size="10">KPIs &amp; Latency Gauge</text>

  <rect x="655" y="340" width="180" height="90" rx="8" fill="url(#perfGrad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="745" y="375" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">[Q02] CSV Import</text>
  <text x="745" y="398" text-anchor="middle" fill="#cbd5e1" font-size="11">Bulk Catalog Ingestion</text>
  <text x="745" y="415" text-anchor="middle" fill="#bfdbfe" font-size="10">Fast Batch Pipeline</text>

  <rect x="850" y="340" width="190" height="90" rx="8" fill="url(#perfGrad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="375" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">[Q02] Optimized Reports</text>
  <text x="945" y="398" text-anchor="middle" fill="#cbd5e1" font-size="11">Borrowing / Overdue</text>
  <text x="945" y="415" text-anchor="middle" fill="#bfdbfe" font-size="10">Vectorized Summaries</text>

  <!-- Arrows L2 to L3 -->
  <line x1="150" y1="430" x2="150" y2="480" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="430" x2="345" y2="480" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="430" x2="545" y2="480" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="430" x2="745" y2="480" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="945" y1="430" x2="945" y2="480" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

