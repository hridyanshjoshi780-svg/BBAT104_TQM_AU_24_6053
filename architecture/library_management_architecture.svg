  <text x="60" y="322" fill="#94a3b8" font-size="14" font-weight="bold">2. LIBRARY MANAGEMENT INTERFACE (CustomTkinter / Modern GUI)</text>
  
  <rect x="60" y="340" width="180" height="90" rx="8" fill="url(#uiGrad)" stroke="#64748b" stroke-width="1"/>
  <text x="150" y="375" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">[Q02] Fast Search</text>
