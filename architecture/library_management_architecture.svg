  <rect x="40" y="660" width="1020" height="180" rx="10" fill="#13274f" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="688" fill="#60a5fa" font-size="14" font-weight="bold">4. PERFORMANCE OPTIMIZATION LAYER (Core Q02 Quality Goal Focus)</text>

  <rect x="60" y="705" width="180" height="115" rx="8" fill="url(#perfGrad)" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="150" y="730" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">[Q02] Fast Search</text>
  <text x="150" y="750" text-anchor="middle" fill="#bfdbfe" font-size="11">Prefix/Substring Match</text>
  <text x="150" y="770" text-anchor="middle" fill="#bfdbfe" font-size="11">Active Query Cache</text>
  <text x="150" y="790" text-anchor="middle" fill="#bfdbfe" font-size="11">Selective Columns</text>
  <text x="150" y="808" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">Target: &lt; 50 ms</text>

  <rect x="255" y="705" width="180" height="115" rx="8" fill="url(#perfGrad)" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="345" y="730" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Streamlined Checkout</text>
  <text x="345" y="750" text-anchor="middle" fill="#bfdbfe" font-size="11">Atomic Single-Step</text>
  <text x="345" y="770" text-anchor="middle" fill="#bfdbfe" font-size="11">Fast Copy Decrement</text>
  <text x="345" y="790" text-anchor="middle" fill="#bfdbfe" font-size="11">Eliminated Redundancy</text>
  <text x="345" y="808" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">Zero Inventory Lock</text>

  <rect x="450" y="705" width="190" height="115" rx="8" fill="url(#perfGrad)" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="545" y="730" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">[Q02] Dashboard Engine</text>
  <text x="545" y="750" text-anchor="middle" fill="#bfdbfe" font-size="11">Aggregated Pre-counts</text>
  <text x="545" y="770" text-anchor="middle" fill="#bfdbfe" font-size="11">Instant KPI Assembly</text>
  <text x="545" y="790" text-anchor="middle" fill="#bfdbfe" font-size="11">Optimized UI Render</text>
  <text x="545" y="808" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">Target: &lt; 100 ms</text>

  <rect x="655" y="705" width="180" height="115" rx="8" fill="url(#perfGrad)" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="745" y="730" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">[Q02] CSV Ingestion</text>
  <text x="745" y="750" text-anchor="middle" fill="#bfdbfe" font-size="11">executemany() Batch</text>
  <text x="745" y="770" text-anchor="middle" fill="#bfdbfe" font-size="11">Single DB Transaction</text>
  <text x="745" y="790" text-anchor="middle" fill="#bfdbfe" font-size="11">Fast Validation Chunk</text>
  <text x="745" y="808" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">1000 records/sec</text>

  <rect x="850" y="705" width="190" height="115" rx="8" fill="url(#perfGrad)" stroke="#93c5fd" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="945" y="730" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">[Q02] Report Engine</text>
  <text x="945" y="750" text-anchor="middle" fill="#bfdbfe" font-size="11">Pandas Vectorized Ops</text>
  <text x="945" y="770" text-anchor="middle" fill="#bfdbfe" font-size="11">Filtered Projections</text>
  <text x="945" y="790" text-anchor="middle" fill="#bfdbfe" font-size="11">Avoids Full Table Scans</text>
  <text x="945" y="808" text-anchor="middle" fill="#facc15" font-size="10" font-weight="bold">Target: &lt; 200 ms</text>

  <!-- Arrows L4 to L5 -->
