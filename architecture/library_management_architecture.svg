  <rect x="60" y="930" width="980" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="550" y="952" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">[Q02] Efficient Query Execution Layer: Row Factory | Parameterized Prepared Statements | PRAGMA foreign_keys = ON</text>
  <text x="550" y="970" text-anchor="middle" fill="#6ee7b7" font-size="11">Direct Indexed B-Tree Lookups (O(log N)) | Eliminates Unnecessary SELECT * Scans | Immediate Sub-10ms Transaction Locks</text>

