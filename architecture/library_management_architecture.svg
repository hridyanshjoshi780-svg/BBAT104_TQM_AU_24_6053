  <line x1="345" y1="610" x2="345" y2="660" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="610" x2="545" y2="660" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="610" x2="745" y2="660" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="945" y1="610" x2="945" y2="660" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

