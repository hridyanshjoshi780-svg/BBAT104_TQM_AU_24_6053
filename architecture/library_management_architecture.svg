  <rect x="60" y="995" width="225" height="110" rx="8" fill="url(#dbGrad)" stroke="#34d399" stroke-width="1.2"/>
  <text x="172" y="1020" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">books Table</text>
  <text x="172" y="1040" text-anchor="middle" fill="#a7f3d0" font-size="11">id (PK), title, author</text>
  <text x="172" y="1058" text-anchor="middle" fill="#a7f3d0" font-size="11">isbn (UNIQUE), category</text>
  <text x="172" y="1078" text-anchor="middle" fill="#facc15" font-size="11" font-weight="bold">INDEX (isbn, title)</text>
  <text x="172" y="1095" text-anchor="middle" fill="#6ee7b7" font-size="10">INDEX (category)</text>

  <rect x="310" y="995" width="225" height="110" rx="8" fill="url(#dbGrad)" stroke="#34d399" stroke-width="1.2"/>
  <text x="422" y="1020" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">users Table</text>
  <text x="422" y="1040" text-anchor="middle" fill="#a7f3d0" font-size="11">id (PK), username</text>
  <text x="422" y="1058" text-anchor="middle" fill="#a7f3d0" font-size="11">password_hash, role</text>
  <text x="422" y="1078" text-anchor="middle" fill="#facc15" font-size="11" font-weight="bold">INDEX (username)</text>
  <text x="422" y="1095" text-anchor="middle" fill="#6ee7b7" font-size="10">INDEX (role)</text>

  <rect x="560" y="995" width="235" height="110" rx="8" fill="url(#dbGrad)" stroke="#34d399" stroke-width="1.2"/>
  <text x="677" y="1020" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">borrow_records Table</text>
  <text x="677" y="1040" text-anchor="middle" fill="#a7f3d0" font-size="11">id (PK), book_id, user_id</text>
  <text x="677" y="1058" text-anchor="middle" fill="#a7f3d0" font-size="11">borrow_date, due_date, status</text>
  <text x="677" y="1078" text-anchor="middle" fill="#facc15" font-size="11" font-weight="bold">INDEX (book_id, status)</text>
  <text x="677" y="1095" text-anchor="middle" fill="#6ee7b7" font-size="10">INDEX (user_id, status)</text>

  <rect x="820" y="995" width="220" height="110" rx="8" fill="url(#dbGrad)" stroke="#34d399" stroke-width="1.2"/>
  <text x="930" y="1020" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">search_metrics Table</text>
  <text x="930" y="1040" text-anchor="middle" fill="#a7f3d0" font-size="11">id (PK), timestamp</text>
  <text x="930" y="1058" text-anchor="middle" fill="#a7f3d0" font-size="11">duration_ms, query</text>
  <text x="930" y="1078" text-anchor="middle" fill="#facc15" font-size="11" font-weight="bold">INDEX (timestamp)</text>
  <text x="930" y="1095" text-anchor="middle" fill="#6ee7b7" font-size="10">SQC Quality Analysis</text>

  <!-- Connect L5 to L6 (Upward / Outward response flow) -->
  <line x1="550" y1="1120" x2="550" y2="1165" stroke="#e879f9" stroke-width="2.5" marker-end="url(#arrow)"/>

