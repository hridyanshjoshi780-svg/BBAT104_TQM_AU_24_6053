  <text x="550" y="62" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="bold" letter-spacing="0.5">LIBRARY MANAGEMENT SYSTEM — SYSTEM ARCHITECTURE</text>
  <text x="550" y="94" text-anchor="middle" fill="#93c5fd" font-size="14">BBAT104 Fundamentals of Total Quality Management | Quality Goal: Q02 Improve Performance | Roll No: 31</text>

  <!-- LAYER 1: USER & ACCESS -->
